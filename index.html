<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Papo Aberto</title>
  <meta name="description" content="Um chat para bater papo com a IA.">
  <style>
    :root {
      --fundo: #fbf6ef;
      --painel: #ffffff;
      --texto: #2b2622;
      --suave: #7a6f66;
      --borda: #eadfd2;
      --destaque: #e4572e;
      --destaque-texto: #ffffff;
      --balao-bot: #f3e9dc;
      --balao-eu: #e4572e;
      --erro-fundo: #fde8e3;
      --erro-texto: #9a2a10;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #1b1816;
        --painel: #242020;
        --texto: #f2ebe3;
        --suave: #a89c91;
        --borda: #3a332e;
        --destaque: #ff7a52;
        --destaque-texto: #1b1816;
        --balao-bot: #2f2926;
        --balao-eu: #ff7a52;
        --erro-fundo: #3d211b;
        --erro-texto: #ffb4a0;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--fundo);
      color: var(--texto);
      font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      background: var(--painel);
      border-left: 1px solid var(--borda);
      border-right: 1px solid var(--borda);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--borda);
    }
    .marca { display: flex; align-items: center; gap: 10px; }
    .marca-icone {
      width: 36px; height: 36px; border-radius: 12px;
      background: var(--destaque); color: var(--destaque-texto);
      display: grid; place-items: center; font-weight: 800; font-size: 18px;
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
    .sub { font-size: 12.5px; color: var(--suave); margin: 0; }

    button { font: inherit; cursor: pointer; }
    .nova {
      background: transparent; color: var(--suave);
      border: 1px solid var(--borda); border-radius: 999px;
      padding: 7px 14px; font-size: 14px;
    }
    .nova:hover { color: var(--texto); border-color: var(--suave); }

    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg.bot { align-self: flex-start; background: var(--balao-bot); border-bottom-left-radius: 6px; }
    .msg.eu  { align-self: flex-end; background: var(--balao-eu); color: var(--destaque-texto); border-bottom-right-radius: 6px; }
    .msg.digitando { color: var(--suave); font-style: italic; }
    .msg.erro {
      align-self: center; max-width: 95%; text-align: center;
      background: var(--erro-fundo); color: var(--erro-texto); font-size: 14.5px;
    }

    #codigo-form {
      display: flex; gap: 8px; padding: 10px 16px;
      border-top: 1px solid var(--borda); background: var(--balao-bot);
    }
    #codigo-form[hidden] { display: none; }
    #codigo-form label { position: absolute; left: -9999px; }
    #codigo {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit;
      border: 1px solid var(--borda); border-radius: 12px;
      background: var(--painel); color: var(--texto);
    }

    #form {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--borda);
    }
    #campo {
      flex: 1; min-width: 0; resize: none; max-height: 140px;
      padding: 11px 14px; font: inherit; line-height: 1.35;
      border: 1px solid var(--borda); border-radius: 20px;
      background: var(--fundo); color: var(--texto);
    }
    #campo:focus, #codigo:focus { outline: 2px solid var(--destaque); outline-offset: 1px; }
    .enviar {
      background: var(--destaque); color: var(--destaque-texto);
      border: 0; border-radius: 20px; padding: 11px 18px; font-weight: 700;
    }
    .enviar:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="marca">
        <div class="marca-icone" aria-hidden="true">P</div>
        <div>
          <h1>Papo Aberto</h1>
          <p class="sub">Puxe assunto sobre qualquer coisa</p>
        </div>
      </div>
      <button type="button" class="nova" id="nova">Nova conversa</button>
    </header>

    <main id="mensagens" aria-live="polite" aria-label="Conversa"></main>

    <form id="codigo-form" hidden>
      <label for="codigo">Código de acesso</label>
      <input id="codigo" type="password" autocomplete="off" placeholder="Código dos amigos">
      <button type="submit" class="enviar">Entrar</button>
    </form>

    <form id="form">
      <label for="campo" style="position:absolute;left:-9999px">Sua mensagem</label>
      <textarea id="campo" rows="1" placeholder="Escreva sua mensagem…" maxlength="4000"></textarea>
      <button type="submit" class="enviar" id="enviar">Enviar</button>
    </form>
  </div>

  <script>
    const lista = document.getElementById("mensagens");
    const form = document.getElementById("form");
    const campo = document.getElementById("campo");
    const botaoEnviar = document.getElementById("enviar");
    const botaoNova = document.getElementById("nova");
    const codigoForm = document.getElementById("codigo-form");
    const codigoCampo = document.getElementById("codigo");

    const SAUDACAO = "Oi! Eu sou o Papo Aberto. Pode puxar assunto sobre o que quiser.";

    let idAnterior = null;   // id da última rodada, para a IA lembrar da conversa
    let ocupado = false;
    let pendente = null;     // mensagem que espera o código de acesso

    function lerCodigo() {
      try { return localStorage.getItem("papo-codigo") || ""; } catch { return ""; }
    }
    function guardarCodigo(valor) {
      try { localStorage.setItem("papo-codigo", valor); } catch {}
    }

    function adicionar(classe, texto) {
      const div = document.createElement("div");
      div.className = "msg " + classe;
      div.textContent = texto;
      lista.appendChild(div);
      lista.scrollTop = lista.scrollHeight;
      return div;
    }

    function atualizarBotao() {
      botaoEnviar.disabled = ocupado || campo.value.trim() === "";
    }

    function ajustarAltura() {
      campo.style.height = "auto";
      campo.style.height = Math.min(campo.scrollHeight, 140) + "px";
    }

    async function enviar(texto) {
      ocupado = true;
      atualizarBotao();
      const digitando = adicionar("bot digitando", "digitando…");
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensagem: texto, idAnterior, codigo: lerCodigo() }),
        });
        const dados = await r.json().catch(() => ({}));
        digitando.remove();

        if (r.status === 401) {
          pendente = texto;
          codigoForm.hidden = false;
          codigoCampo.focus();
          adicionar("erro", dados.erro || "Digite o código de acesso para continuar.");
          return;
        }
        if (!r.ok) {
          if (dados.reiniciar) idAnterior = null;
          adicionar("erro", dados.erro || "Algo deu errado. Tente de novo.");
          return;
        }
        idAnterior = dados.idInteracao || null;
        adicionar("bot", dados.resposta || "(a IA não respondeu nada, tente de novo)");
      } catch {
        digitando.remove();
        adicionar("erro", "Sem conexão com o servidor. Confira sua internet e tente de novo.");
      } finally {
        ocupado = false;
        atualizarBotao();
        if (codigoForm.hidden) campo.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const texto = campo.value.trim();
      if (!texto || ocupado) return;
      adicionar("eu", texto);
      campo.value = "";
      ajustarAltura();
      atualizarBotao();
      enviar(texto);
    });

    codigoForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const valor = codigoCampo.value.trim();
      if (!valor) return;
      guardarCodigo(valor);
      codigoCampo.value = "";
      codigoForm.hidden = true;
      if (pendente && !ocupado) {
        const texto = pendente;
        pendente = null;
        enviar(texto);
      }
    });

    campo.addEventListener("input", () => { ajustarAltura(); atualizarBotao(); });
    campo.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    botaoNova.addEventListener("click", () => {
      idAnterior = null;
      pendente = null;
      lista.replaceChildren();
      adicionar("bot", SAUDACAO);
      campo.focus();
    });

    adicionar("bot", SAUDACAO);
    atualizarBotao();
  </script>
</body>
</html>
